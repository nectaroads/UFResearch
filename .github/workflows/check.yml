name: Verificar cliente e servidor

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
        working-directory: server
      - run: npm run check
        working-directory: server
      - run: npm run check
        working-directory: client
      - run: node --check setup.mjs
      - name: Testar a abertura do portal e o banco local
        run: node checks/iniciador.mjs
        timeout-minutes: 5
