name: Publicar portal no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/configure-pages@v5
      - run: node client/build-pages.mjs
        env:
          UFRESEARCH_API_URL: ${{ vars.UFRESEARCH_API_URL }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: client/dist
      - uses: actions/deploy-pages@v4
        id: deployment
